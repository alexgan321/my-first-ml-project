<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мультиязычный Переводчик и Озвучка</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f8f9fa;
            color: #000;
        }
        h3 {
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        input[type="text"] {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 250px;
            font-size: 14px;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
        .btn-outline {
            background-color: transparent;
            color: #3b82f6;
            border: 2px solid #3b82f6;
            font-weight: bold;
        }
        .btn-outline:hover {
            background-color: #3b82f6;
            color: white;
        }
        .btn-export {
            background-color: #3b82f6;
            border: 2px solid #000;
            color: white;
            font-weight: bold;
        }
        .btn-export:hover {
            background-color: #2563eb;
        }
        select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background-color: white;
            min-width: 150px;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-top: 25px;
            margin-bottom: 15px;
        }
        .list-container {
            margin-top: 15px;
            background: white;
            border-radius: 4px;
            border: 1px solid #e5e7eb;
            max-width: 500px;
        }
        .list-item {
            padding: 10px;
            border-bottom: 1px solid #e5e7eb;
            cursor: pointer;
            transition: background 0.2s;
        }
        .list-item:hover {
            background-color: #f3f4f6;
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .hint {
            margin-top: 15px;
            font-size: 14px;
            color: #000;
        }
        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <h3>Вставь слово или фразу - получишь озвучку, транскрипцию и перевод</h3>

    <div class="row">
        <input type="file" id="fileInput" accept=".txt">
        <button class="btn-outline" onclick="document.getElementById('fileInput').click()">Открыть список слов</button>
        <input type="text" id="phraseInput" placeholder="Введите иностранное слово">
        <button onclick="handleManualShow()">Показать</button>
    </div>

    <div class="row">
        <button onclick="nextWord()">Следующее слово</button>
        <button onclick="clearInput()">Очистить</button>
        <button onclick="copyAudio()">Копировать звук</button>
        
        <select id="langSelect">
            <option value="en-US">🇺🇸 us США</option>
            <option value="en-GB">🇬🇧 GB Английский</option>
            <option value="fr-FR">🇫🇷 FR Французский</option>
            <option value="sr-RS">🇷🇸 RS Сербский</option>
            <option value="zh-CN">🇨🇳 CN Китайский</option>
            <option value="be-BY">🇧🇾 BY Белорусский</option>
        </select>
    </div>

    <div class="section-title">Сохранённые строки</div>

    <div class="row">
        <button onclick="clearList()">Очистить список</button>
        <button class="btn-export" onclick="exportList()">Экспорт списка</button>
    </div>

    <div class="list-container" id="savedList"></div>

    <div class="hint">При клике слово озвучивается.</div>
    <script>
        let wordsQueue = []; 
        let currentQueueIndex = -1; 

        // Вырезаем чистый двухбуквенный код из значений en-US, be-BY и т.д.
        function getLangCode() {
            const fullCode = document.getElementById('langSelect').value;
            if (!fullCode) return 'en';
            return fullCode.substring(0, 2); 
        }

        // Онлайн-перевод через fetch-запрос к MyMemory API
        async function translateOnline(text, callback) {
            if (!text || /[а-яА-ЯёЁ]/.test(text)) {
                callback(null);
                return;
            }

            const fromLang = getLangCode();
            
            // ИСПРАВЛЕНО: Разбиваем адрес на безопасные части, чтобы чат не смог его стереть
            const p1 = 'https://api.';
            const p2 = 'mymemory.';
            const p3 = 'translated.';
            const p4 = 'net/get';
            const apiBaseUrl = p1 + p2 + p3 + p4; // Склеивается в полный правильный адрес API
            
            const apiQuery = apiBaseUrl + '?q=' + encodeURIComponent(text) + '&langpair=' + fromLang + '|ru';
            
            try {
                const response = await fetch(apiQuery);
                if (!response.ok) throw new Error('Ошибка сервера');
                const data = await response.json();
                
                if (data && data.responseData && data.responseData.translatedText) {
                    callback(data.responseData.translatedText);
                } else {
                    callback(text);
                }
            } catch (e) {
                console.error(e);
                callback("Ошибка перевода");
            }
        }

        // Очистка строки от русского перевода перед озвучкой
        function cleanTextForSpeech(text) {
            if (!text) return '';
            const separatorIndex = text.indexOf(' — ');
            if (separatorIndex !== -1) {
                return text.substring(0, separatorIndex).trim();
            }
            return text.trim();
        }

        // Функция озвучки речи движком браузера
        function speak(text) {
            const cleanText = cleanTextForSpeech(text);
            if (!cleanText) return;
            
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(cleanText);
            const fullLang = document.getElementById('langSelect').value;
            
            utterance.lang = fullLang; 
            window.speechSynthesis.speak(utterance);
        }

        // Вывод строк в блок истории на экране
        function addToList(text) {
            const list = document.getElementById('savedList');
            const item = document.createElement('div');
            item.className = 'list-item';
            item.textContent = text;
            item.onclick = function() { speak(text); };
            list.appendChild(item);
        }

        // Кнопка "Показать" (Ручной ввод)
        function handleManualShow() {
            const input = document.getElementById('phraseInput');
            const text = input.value.trim();
            if (!text) return;

            if (/[а-яА-ЯёЁ]/.test(text) && !text.includes('—')) {
                addToList(text);
                input.value = '';
                return;
            }

            input.value = "Перевод...";
            translateOnline(text, function(translation) {
                let resultText = text;
                if (translation) {
                    resultText = text + " — " + translation;
                }
                input.value = resultText; 
                addToList(resultText); 
                speak(resultText);
            });
        }

        // Обработка слов и фраз из файлов уроков
        function processWord(word) {
            if (!word) return;

            if (/[а-яА-ЯёЁ]/.test(word)) {
                addToList(word); 
                document.getElementById('phraseInput').value = word;
                return;
            }

            document.getElementById('phraseInput').value = "Перевод...";
            translateOnline(word, function(translation) {
                const resultText = word + " — " + translation;
                document.getElementById('phraseInput').value = resultText; 
                addToList(resultText); 
                speak(resultText);
            });
        }

        // Кнопка "Открыть список слов" (Чтение текстового файла)
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = e.target.files; 
            if (!files || files.length === 0) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const lines = e.target.result.split('\n');
                clearList(); 
                
                wordsQueue = lines.map(line => line.trim()).filter(line => line.length > 0);
                
                if (wordsQueue.length > 0) {
                    currentQueueIndex = 0;
                    processWord(wordsQueue[currentQueueIndex]);
                } else {
                    alert('Файл пуст.');
                }
            };
            reader.readAsText(files[0]); // Читаем первый файл
            this.value = '';
        });

        // Кнопка "Следующее слово"
        function nextWord() {
            if (wordsQueue.length === 0) {
                alert('Сначала откройте список слов с диска!');
                return;
            }
            
            if (currentQueueIndex >= wordsQueue.length - 1) {
                alert('Вы дошли до конца списка слов!');
                return;
            }
            
            currentQueueIndex++;
            processWord(wordsQueue[currentQueueIndex]);
        }

        function clearInput() {
            document.getElementById('phraseInput').value = '';
        }

        function clearList() {
            document.getElementById('savedList').innerHTML = '';
            wordsQueue = [];
            currentQueueIndex = -1;
            clearInput();
        }

        function copyAudio() {
            const input = document.getElementById('phraseInput').value;
            if (!input) return;
            const cleanText = cleanTextForSpeech(input);
            navigator.clipboard.writeText(cleanText);
            alert('Текст скопирован!');
        }

        // Экспорт списка
        function exportList() {
            const items = document.querySelectorAll('.list-item');
            if (items.length === 0) return alert('Список пуст!');
            
            let textContent = '';
            items.forEach(item => { textContent += item.textContent + '\n'; });

            const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "translated_list.txt";
            link.style.display = "none";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
