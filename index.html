<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мультиязычный Переводчик и Озвучка</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; padding: 20px; color: #333; }
        .container { max-width: 750px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h3 { text-align: center; font-size: 18px; margin-bottom: 25px; color: #1e293b; font-weight: 700; }
        .row { display: flex; gap: 12px; margin-bottom: 15px; align-items: center; flex-wrap: wrap; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; min-width: 250px; }
        input[type="text"]:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        button { background: #3b82f6; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 500; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        button.secondary { background: #64748b; }
        button.secondary:hover { background: #475569; }
        select { padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; background: white; min-width: 160px; cursor: pointer; }
        .result-box { font-size: 20px; font-weight: 600; margin: 25px 0; min-height: 35px; cursor: pointer; display: inline-block; padding: 12px 18px; border-radius: 6px; color: #1e293b; border: 2px dashed #3b82f6; background: #f8fafc; transition: all 0.2s; user-select: none; }
        .result-box:hover { background: #eff6ff; border-color: #2563eb; }
        .section-title { font-weight: 700; margin-top: 30px; margin-bottom: 12px; color: #1e293b; font-size: 16px; }
        .hint { font-size: 14px; color: #64748b; margin-top: 25px; display: flex; align-items: center; gap: 5px; }
        .status-panel { background: #f0fdf4; border: 1px dashed #16a34a; border-radius: 6px; padding: 12px; margin-bottom: 15px; font-size: 14px; color: #14532d; display: none; }
        #fileInput { display: none; }
    </style>

    <script>
        // Скрипты загружаются в первую очередь!
        var fileWordsArray = [];
        var currentFileIndex = 0;
        var fileHeaderTitle = "";

        function triggerFileChoose() {
            document.getElementById('fileInput').click();
        }

        function handleFileSelect(event) {
            var file = event.target.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(e) {
                var text = e.target.result;
                var allLines = text.split('\n').map(function(line) { return line.trim(); }).filter(function(line) { return line.length > 0; });
                
                if (allLines.length > 0) {
                    fileHeaderTitle = allLines[0];
                    fileWordsArray = allLines.slice(1);
                    currentFileIndex = 0;

                    document.getElementById('listTitleText').innerText = fileHeaderTitle;
                    document.getElementById('fileStatusText').innerText = fileWordsArray.length;
                    document.getElementById('statusPanel').style.display = "block";
                } else {
                    alert("Выбранный файл пуст!");
                }
            };
            reader.readAsText(file, "UTF-8");
        }

        function processWord() {
            var input = document.getElementById('wordInput').value.trim();
            var outputDiv = document.getElementById('resultOutput');
            var select = document.getElementById('langSelect');
            var fromLang = select.options[select.selectedIndex].getAttribute('data-lang');

            if (!input) {
                outputDiv.innerText = "Поле ввода пустое";
                return;
            }

            outputDiv.innerText = "Загрузка перевода...";

            var callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
            
            var fallbackTimeout = setTimeout(function() {
                outputDiv.innerText = input + " / [Перевод загружается...]";
                speakText();
                window[callbackName] = function() {}; 
            }, 1500);

            window[callbackName] = function(data) {
                clearTimeout(fallbackTimeout);
                var translation = (data && data.responseData) ? data.responseData.translatedText : "[" + input + "]";
                
                if (fromLang === 'en') {
                    var xhr = new XMLHttpRequest();
                    xhr.open('GET', 'https://dictionaryapi.dev' + encodeURIComponent(input), true);
                    xhr.onload = function() {
                        var transcription = "";
                        if (xhr.status === 200) {
                            try {
                                var resData = JSON.parse(xhr.responseText);
                                transcription = resData[0]?.phonetic || resData[0]?.phonetics?.find(function(p) { return p.text; })?.text || "";
                            } catch(e) {}
                        }
                        outputDiv.innerText = input + (transcription ? " / [" + transcription + "]" : "") + " / " + translation;
                        speakText();
                    };
                    xhr.onerror = function() {
                        outputDiv.innerText = input + " / " + translation;
                        speakText();
                    };
                    xhr.send();
                } else {
                    outputDiv.innerText = input + " / " + translation;
                    speakText();
                }
                delete window[callbackName];
            };

            var script = document.createElement('script');
            script.src = 'https://translated.net' + encodeURIComponent(input) + '&langpair=' + fromLang + '|ru&callback=' + callbackName;
            document.body.appendChild(script);
        }

        function speakText() {
            var text = document.getElementById('wordInput').value.trim();
            if (!text) return;
            
            window.speechSynthesis.cancel(); 
            var utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = document.getElementById('langSelect').value;
            window.speechSynthesis.speak(utterance);
        }

        function nextWord() {
            if (fileWordsArray.length === 0) {
                alert("Сначала нажмите 'Открыть список слов' и укажите .txt файл на вашем диске!");
                return;
            }

            if (currentFileIndex >= fileWordsArray.length) {
                alert("🎉 Все слова из списка пройдены! Начинаем сначала.");
                currentFileIndex = 0;
            }

            document.getElementById('wordInput').value = fileWordsArray[currentFileIndex];
            document.getElementById('fileStatusText').innerText = fileWordsArray.length + " (Текущее: " + (currentFileIndex + 1) + ")";
            
            currentFileIndex++;
            processWord();
        }

        function copyAudio() {
            var text = document.getElementById('wordInput').value.trim();
            var select = document.getElementById('langSelect');
            var fromLang = select.options[select.selectedIndex].getAttribute('data-lang');
            if (!text) return alert("Поле пустое!");
            var audioUrl = "https://google.com" + fromLang + "&client=tw-ob&q=" + encodeURIComponent(text);
            
            var dummy = document.createElement("input");
            document.body.appendChild(dummy);
            dummy.value = audioUrl;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);
            alert("Ссылка на звук скопирована в буфер обмена!");
        }

        function exportList() {
            if (fileWordsArray.length === 0) {
                alert("Список пуст. Загрузите файл с диска.");
                return;
            }
            
            var select = document.getElementById('langSelect');
            var fromLang = select.options[select.selectedIndex].getAttribute('data-lang');
            var exportBtn = document.getElementById('exportBtn');
            exportBtn.disabled = true;
            exportBtn.innerText = "Экспорт...";

            var dictionaryLines = [fileHeaderTitle + " - Словарь"];
            
            function translateNext(index) {
                if (index >= fileWordsArray.length) {
                    var fileContent = dictionaryLines.join('\n');
                    var blob = new Blob([fileContent], { type: "text/plain;charset=utf-8" });
                    var link = document.createElement("a");
                    link.href = URL.createObjectURL(blob);
                    link.download = "dictionary_" + fromLang + ".txt";
                    link.click();
                    
                    exportBtn.disabled = false;
                    exportBtn.innerText = "Экспорт списка";
                    return;
                }

                var currentWord = fileWordsArray[index];
                var xhr = new XMLHttpRequest();
                var url = 'https://translated.net' + encodeURIComponent(currentWord) + '&langpair=' + fromLang + '|ru';
                
                xhr.open('GET', url, true);
                xhr.onload = function() {
                    var trans = "[Нет перевода]";
                    if (xhr.status >= 200 && xhr.status < 400) {
                        try {
